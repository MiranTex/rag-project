services:
  chroma:
    image: chromadb/chroma:0.5.5
    container_name: rag_chroma
    ports:
      - "8001:8000"
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
      - IS_PERSISTENT=TRUE
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  chroma_data:
