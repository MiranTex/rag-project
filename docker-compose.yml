services:
  postgres:
    # PostgreSQL 17 com pgvector: base de dados da aplicação e vetores (tabela vector_embeddings).
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rag}
      - POSTGRES_DB=rag
    # Só no host local (para correr o backend fora do Docker ou os testes de contrato com TEST_DATABASE_URL).
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://rag:${POSTGRES_PASSWORD:-rag}@postgres:5432/rag
      - LM_STUDIO_BASE_URL=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/exports:/app/data/exports
      - backend_storage:/app/backend/storage
      - hf_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
  hf_cache:
